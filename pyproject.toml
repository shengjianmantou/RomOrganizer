[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "romorganizer"
version = "0.1.0"
description = "A Calibre-like ROM library manager for retro gaming"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "py7zr>=0.21.0",
    "rarfile>=4.1",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.3.0",
    "lxml>=5.2.0",
    "pillow>=10.3.0",
    "sse-starlette>=2.1.0",
    "anyio>=4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
